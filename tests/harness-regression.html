<script>
(function(){
  const results = [];
  function check(label, cond, extra) { results.push({label, pass: !!cond, extra: extra===undefined?'':String(extra)}); }
  function click(el, init) {
    if (!el) { throw new Error('click target missing'); }
    el.dispatchEvent(new MouseEvent('click', Object.assign({bubbles:true, cancelable:true}, init||{})));
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rows = () => [...document.querySelectorAll('#rv-table-wrap tr[data-txnid]')];
  const rowIds = () => rows().map(r => r.dataset.txnid);
  const selRows = () => [...document.querySelectorAll('#rv-table-wrap tr.rv-row-selected')];
  const pickOption = (name) => {
    const opt = [...document.querySelectorAll('#cp-picker-list .rv-cat-option')]
      .find(o => o.textContent.trim() === name);
    click(opt);
  };

  window.addEventListener('DOMContentLoaded', async () => {
   try {
    App.goto('review');
    const fx = (n, o) => Object.assign({
      id: n, post_date: '2025-0'+((n%9)+1)+'-1'+(n%9), trans_date: '2025-01-01',
      txn_type: 'Debit', reference: 'REF '+n, amount: -100*n, balance: 0, fees: 0,
      category: 'Uncategorised', source_file: 'file'+(n%3)+'.pdf'
    }, o||{});

    /* ═══ REVIEW: render / sort / multi-select ═══ */
    AppState.reviewData = [1,2,3,4,5].map(n => fx(n));
    AppState.reviewData.push(fx(6, {source_file:'file9.pdf', amount: 5000, txn_type:'Credit'}));
    Review.render();
    check('R1 review renders 6 rows', rows().length === 6, rows().length);

    Review.sort('amount');
    const a1 = rowIds();
    Review.sort('amount');
    const a2 = rowIds();
    check('R2 sort by amount orders rows', a1.length === 6 && a1.join() !== rowIds.toString());
    check('R3 second click reverses', a1.join() === [...a2].reverse().join(), a1+' | '+a2);
    Review.sort('post_date');

    click(rows()[0]);
    check('R4 plain click selects one', selRows().length === 1, selRows().length);
    click(rows()[2], {ctrlKey:true});
    check('R5 ctrl-click adds', selRows().length === 2, selRows().length);
    click(rows()[4], {shiftKey:true});
    check('R6 shift-click extends range', selRows().length > 2, selRows().length);
    check('R7 bulk bar appears', !!document.getElementById('rv-bulk-categorize-btn'));
    click(document.getElementById('rv-bulk-clear-btn'));
    check('R8 clear button clears', selRows().length === 0);
    check('R9 bulk bar gone', !document.getElementById('rv-bulk-categorize-btn'));

    /* ═══ bulk categorise through the real DOM path ═══ */
    click(rows()[0]); click(rows()[1], {ctrlKey:true});
    click(document.getElementById('rv-bulk-categorize-btn'));
    check('R10 bulk picker opens', !!document.getElementById('cp-picker-list'));
    const bulkIds = selRows().map(r => r.dataset.txnid);
    pickOption('Insurance');
    const rented = AppState.reviewData.filter(t => t.category === 'Insurance').map(t => String(t.id));
    check('R11 bulk applies to selection only', rented.length === 2 && bulkIds.every(i => rented.includes(i)), rented+' vs '+bulkIds);
    check('R12 others untouched', AppState.reviewData.filter(t=>t.category==='Uncategorised').length === 4);

    /* ═══ single picker: NO fuzzy confirm ═══ */
    let confirmCalls = 0;
    const realConfirm = window.confirm; window.confirm = () => { confirmCalls++; return true; };
    AppState.reviewData = [fx(10, {reference:'WOOLWORTHS SANDTON'}), fx(11, {reference:'WOOLWORTHS SANDTON'})];
    Review.render();
    const firstBadge = document.querySelector('#rv-table-wrap .rv-cat-badge');
    const clickedId = Number(firstBadge.dataset.txnid);
    const otherId = clickedId === 10 ? 11 : 10;
    click(firstBadge);
    check('R13 single picker opens', !!document.getElementById('cp-picker-list'));
    pickOption('Fuel');
    check('R14 sets only the clicked row', AppState.reviewData.find(t=>t.id===clickedId).category === 'Fuel', 'clicked '+clickedId);
    check('R15 near-duplicate untouched', AppState.reviewData.find(t=>t.id===otherId).category === 'Uncategorised', 'other '+otherId);
    check('R16 no confirm() prompt', confirmCalls === 0, confirmCalls);
    check('R17 findSimilar deleted', typeof window.findSimilar === 'undefined');
    window.confirm = realConfirm;

    /* ═══ remove by source ═══ */
    const realConfirm2 = window.confirm, realAlert = window.alert;
    window.confirm = () => true; window.alert = () => {};
    AppState.reviewData = [1,2,3,4,5].map(n => fx(n)).concat([fx(7,{source_file:'dupe.pdf'}), fx(8,{source_file:'dupe.pdf'})]);
    Review.render();
    const sel = document.getElementById('rv-source-filter');
    check('R18 source dropdown has the file', [...sel.options].some(o => o.value === 'dupe.pdf'), [...sel.options].map(o=>o.value).join('|'));
    sel.value = 'dupe.pdf';
    Review.removeSource();
    check('R19 removeSource drops both rows', AppState.reviewData.length === 5 &&
      !AppState.reviewData.some(t => t.source_file === 'dupe.pdf'), AppState.reviewData.length);

    /* ═══ locked trading rows survive removeSource ═══ */
    AppState.reviewData = [fx(20)];
    Review.mergeTrading([fx(900001, {category:'Trading P&L', amount:15000, source:'Future Fund – Topflite', source_file:'topflite-pdf.trading', locked:true})]);
    Review.render();
    const tr = AppState.reviewData.find(t => t.category === 'Trading P&L');
    check('R20 mergeTrading adds locked row', !!tr && tr.locked === true);
    check('R21 trading row buckets as trading', tr && txnBucket(tr) === 'trading');
    click(document.querySelector('#rv-table-wrap tr[data-txnid="900001"]'));
    check('R22 locked row not selectable', selRows().length === 0);
    window.confirm = realConfirm2; window.alert = realAlert;


    /* ═══ UNVAULT: encrypted PDFs are decrypted by pdf.js, not pdf-lib ═══
       pdf-lib has no decryption support; the old code passed it a `password`
       it ignored and then threw "Input document to PDFDocument.load is
       encrypted". These prove the pdf.js path handles all three outcomes. */
    App.goto('unvault');
    const PW = 'correct-horse';
    let lastGetDocOpts = null;
    const realPdfjs = window['pdfjs-dist/build/pdf'];
    window['pdfjs-dist/build/pdf'] = {
      GlobalWorkerOptions: {},
      getDocument(opts) {
        lastGetDocOpts = opts;
        const pwErr = (code, msg) => { const e = new Error(msg); e.name = 'PasswordException'; e.code = code; return e; };
        if (opts.password === undefined) return { promise: Promise.reject(pwErr(1, 'No password given')) };
        if (opts.password !== PW)        return { promise: Promise.reject(pwErr(2, 'Incorrect Password')) };
        return { promise: Promise.resolve({ numPages: 4, destroy() {} }) };
      }
    };
    const mkFile = n => new File([new Uint8Array([37,80,68,70])], n, { type: 'application/pdf' });
    const pwBox  = document.getElementById('uv-password');
    const uvStat = () => document.getElementById('uv-status').textContent;

    AppState.unlockedFiles = [];

    /* no password on an encrypted file */
    Unvault.onFileSelect({ files: [mkFile('enc1.pdf')], value: '' });
    pwBox.value = '';
    await Unvault.unlock();
    check('U1 no password → nothing unlocked', AppState.unlockedFiles.length === 0);
    check('U2 no password → actionable message', /password protected/i.test(uvStat()), uvStat().slice(0,80));
    check('U3 no pdf-lib encryption error surfaced', !/PDFDocument\.load/.test(uvStat()));

    /* wrong password — file must stay queued for a retry */
    pwBox.value = 'wrong';
    await Unvault.unlock();
    check('U4 wrong password → nothing unlocked', AppState.unlockedFiles.length === 0);
    check('U5 wrong password reported', /wrong password/i.test(uvStat()), uvStat().slice(0,60));
    check('U6 failed file stays queued', /still queued|Unlock again/i.test(uvStat()));
    check('U7 password box not cleared on failure', pwBox.value === 'wrong');

    /* correct password */
    pwBox.value = PW;
    await Unvault.unlock();
    check('U8 correct password unlocks', AppState.unlockedFiles.length === 1, AppState.unlockedFiles.length);
    const uf = AppState.unlockedFiles[0];
    check('U9 page count from pdf.js', uf && uf.pages === 4, uf && uf.pages);
    check('U10 password carried for extraction', uf && uf.password === PW);
    check('U11 original bytes kept, not re-saved', uf && uf.bytes instanceof Uint8Array && uf.bytes.length === 4);
    check('U12 password box cleared on success', pwBox.value === '');
    check('U13 pdf.js received the password', lastGetDocOpts && lastGetDocOpts.password === PW);

    /* an unencrypted file still works with an empty box */
    window['pdfjs-dist/build/pdf'].getDocument = (opts) => {
      lastGetDocOpts = opts;
      return { promise: Promise.resolve({ numPages: 2, destroy() {} }) };
    };
    Unvault.onFileSelect({ files: [mkFile('plain.pdf')], value: '' });
    pwBox.value = '';
    await Unvault.unlock();
    check('U14 unencrypted file needs no password', AppState.unlockedFiles.length === 2);
    check('U15 no password stored when none given', AppState.unlockedFiles[1].password === undefined);
    window['pdfjs-dist/build/pdf'] = realPdfjs;
    AppState.unlockedFiles = [];
    App.goto('dashboard');


    /* ═══ EXTRACTOR MERGE: no duplication, no wiping other statements ═══
       mergeFromExtractor used to do `reviewData.filter(t => t.locked)` then
       push everything it was given. Extractor.run() handed it bank rows AND
       AppState.tradingData, so each run appended another copy of the trading
       data; and because unlockedFiles is never persisted, the filter wiped
       every previously extracted statement. Both are covered here. */
    const trade = n => fx(900000+n, {category:'Trading P&L', amount:1000+n,
      reference:'CRATOS / FUTURE FUND P&L '+n, source_file:'cratos-xls.trading',
      source:'Future Fund – Cratos', locked:true});
    const bankRow = (n, file) => fx(n, {source_file:file, reference:'BANK '+file+' '+n});

    AppState.reviewData = [];
    AppState.tradingData = [trade(1), trade(2), trade(3)];
    Review.mergeTrading(AppState.tradingData);
    check('X1 trading rows land in review once', AppState.reviewData.length === 3, AppState.reviewData.length);

    /* first extraction: statement A */
    Review.mergeFromExtractor([bankRow(1,'A.pdf'), bankRow(2,'A.pdf')]);
    check('X2 bank rows added', AppState.reviewData.length === 5, AppState.reviewData.length);
    const tradeCount = () => AppState.reviewData.filter(t => t.category === 'Trading P&L').length;
    check('X3 trading not duplicated by run 1', tradeCount() === 3, tradeCount());

    /* second extraction, different statement — A must survive */
    Review.mergeFromExtractor([bankRow(3,'B.pdf')]);
    check('X4 trading still not duplicated', tradeCount() === 3, tradeCount());
    check('X5 statement A survives a later run',
      AppState.reviewData.filter(t => t.source_file === 'A.pdf').length === 2,
      AppState.reviewData.filter(t => t.source_file === 'A.pdf').length);
    check('X6 statement B added', AppState.reviewData.filter(t => t.source_file === 'B.pdf').length === 1);
    check('X7 total is right', AppState.reviewData.length === 6, AppState.reviewData.length);

    /* re-extracting A replaces A only */
    Review.mergeFromExtractor([bankRow(1,'A.pdf'), bankRow(2,'A.pdf'), bankRow(4,'A.pdf')]);
    check('X8 re-extract replaces that statement',
      AppState.reviewData.filter(t => t.source_file === 'A.pdf').length === 3,
      AppState.reviewData.filter(t => t.source_file === 'A.pdf').length);
    check('X9 other statement untouched', AppState.reviewData.filter(t => t.source_file === 'B.pdf').length === 1);
    check('X10 trading STILL not duplicated', tradeCount() === 3, tradeCount());

    /* the exact old failure: being handed trading rows again */
    Review.mergeFromExtractor([bankRow(5,'C.pdf'), ...AppState.tradingData]);
    check('X11 trading rows passed in again are ignored', tradeCount() === 3, tradeCount());
    check('X12 nothing else lost', AppState.reviewData.filter(t => t.source_file === 'A.pdf').length === 3 &&
                                   AppState.reviewData.filter(t => t.source_file === 'B.pdf').length === 1);

    /* ten runs must not grow the trading data at all */
    for (let i = 0; i < 10; i++) Review.mergeFromExtractor([bankRow(6,'D.pdf'), ...AppState.tradingData]);
    check('X13 ten runs, still three trading rows', tradeCount() === 3, tradeCount());
    AppState.tradingData = [];

    /* ═══ LEDGER keeps the full set ═══ */
    const led = [];
    for (let i=1;i<=60;i++) led.push(fx(i, {
      category: i%4===0 ? 'Trading Capital Drawdown' : (i%3===0 ? 'Fuel' : 'Salaries'),
      amount:   i%4===0 ? 50000 : -100*i,
      reference: i%5===0 ? 'PEREGRINE PAYMENT '+i : 'SHOP '+i,
      post_date: '2025-'+String((i%12)+1).padStart(2,'0')+'-05'
    }));
    AppState.committedData = { transactions: led, metadata: {} };
    App.goto('dashboard');
    Dashboard.mount();
    Shell.nav('ledger');
    const lc = () => document.getElementById('ledger-content').innerHTML;
    check('L1 ledger renders', lc().length > 500);
    check('L2 ledger still shows capital rows', lc().includes('Trading Capital Drawdown'));
    Dashboard.Ledger.setSearch('PEREGRINE');
    check('L3 search filters down', lc().includes('PEREGRINE') && !/SHOP 1</.test(lc()));
    Dashboard.Ledger.setSearch('');
    Dashboard.Ledger.setCat('Fuel');
    const badgeCats = [...document.querySelectorAll('#ledger-content .db-badge')].map(b => b.textContent.trim());
    check('L4 cat filter applies', badgeCats.length > 0 && badgeCats.every(c => c === 'Fuel'), [...new Set(badgeCats)].join('|'));
    Dashboard.Ledger.setCat('');
    Dashboard.Ledger.sort('amount');
    check('L5 sort ok', lc().length > 500);
    /* every row on one screen — no pagination */
    const bodyRows = () => document.querySelectorAll('#ledger-content tbody tr').length;
    check('L6 renders all 60 rows at once', bodyRows() === 60, bodyRows());
    check('L7 no page nav buttons', !document.querySelector('#ledger-content [data-goto-page]'));
    check('L8 no "Page x / y" label', lc().indexOf('Page ') === -1);
    check('L9 goPage no longer exists', typeof Dashboard.Ledger.goPage === 'undefined');
    check('L10 footer shows the full count', /60 transactions/.test(lc()));
    check('L11 footer shows a net total', /net/.test(lc()));
    Dashboard.Ledger.setSearch('PEREGRINE');
    const filtered = bodyRows();
    check('L12 filtered list also shows all matches', filtered > 0 && filtered < 60 && /matching/.test(lc()), filtered);
    Dashboard.Ledger.setSearch('');
    check('L13 ledger full set, KPIs subset', led.length === 60 && operatingOnly(led).length < 60, operatingOnly(led).length+'/60');

    /* ═══ every tab renders after a range preset ═══ */
    Shell.applyPreset('full');
    Shell.nav('overview');
    check('D1 overview', document.getElementById('overview-content').innerHTML.includes('Operating Result'));
    Shell.nav('spending');
    check('D2 spending', document.getElementById('spending-content').innerHTML.length > 300);
    Shell.nav('income');
    check('D3 income', document.getElementById('income-content').innerHTML.length > 300);
    Shell.nav('monthly');
    check('D4 monthly', document.getElementById('monthly-content').innerHTML.length > 500);
    Shell.nav('trading');
    check('D5 trading', document.getElementById('trading-content').innerHTML.includes('Net Capital Drawn'));
    Shell.nav('ledger');
    check('D6 ledger', document.getElementById('ledger-content').innerHTML.length > 500);

    /* ═══ DATE PICKER: draft vs applied, Apply/Cancel, no reset on reopen ═══ */
    const ITEM_H = 40;
    const cols  = side => [...document.querySelectorAll('#drum-' + side + ' .sh-drum-col')];
    const dayC  = side => cols(side)[0];
    const monC  = side => cols(side)[1];
    const yrC   = side => cols(side)[2];
    const applied = () => document.getElementById('range-display').textContent;
    const draft   = () => document.getElementById('sh-range-draft').textContent;
    const kpi     = () => document.getElementById('overview-content').innerHTML;
    // Move a drum the way a real scroll/drag does, then let the 120ms
    // debounce fire.
    const spin = async (col, idx) => { col.scrollTop = idx * ITEM_H; await sleep(200); };

    Shell.applyPreset('full');
    Shell.nav('overview');
    const appliedAtStart = applied();
    const kpiAtStart = kpi();

    Shell.toggleRange();
    await sleep(60);
    check('P1 picker builds drums', cols('from').length === 3 && cols('to').length === 3);
    check('P2 opens showing the applied range', draft() === appliedAtStart, draft() + ' vs ' + appliedAtStart);
    check('P3 hint says nothing pending', /Matches the range in force/.test(document.getElementById('sh-range-hint').textContent));

    /* move the FROM month — draft changes, applied must NOT.
       (Month, not year: the fixture spans a single year, so a year spin
       would be a no-op and every assertion below would pass vacuously.) */
    const draftBefore = draft();
    const startMon    = monC('from')._currentIdx;
    const targetMon   = startMon === 5 ? 8 : 5;
    await spin(monC('from'), targetMon);
    check('P4 draft updates on scroll', draft() !== draftBefore, draftBefore + ' -> ' + draft());
    check('P4b drum landed where told', monC('from')._currentIdx === targetMon, monC('from')._currentIdx);
    check('P5 applied unchanged before Apply', applied() === appliedAtStart, applied());
    check('P6 KPIs unchanged before Apply', kpi() === kpiAtStart);
    check('P7 hint warns it is not applied', /Not applied yet/.test(document.getElementById('sh-range-hint').textContent), document.getElementById('sh-range-hint').textContent);

    /* _jumpTo must follow the live selection, or reopening snaps back */
    check('P8 _jumpTo tracks selection', monC('from')._jumpTo === monC('from')._currentIdx, monC('from')._jumpTo + ' / ' + monC('from')._currentIdx);

    /* Cancel discards */
    Shell.cancelRange();
    await sleep(60);
    check('P9 Cancel leaves applied range alone', applied() === appliedAtStart, applied());
    check('P10 Cancel closes the strip', !document.getElementById('range-strip').classList.contains('open'));

    /* reopening must NOT re-commit a stale index (the original bug) */
    Shell.toggleRange();
    await sleep(250);
    check('P11 reopen shows applied range', draft() === appliedAtStart, draft());
    check('P12 reopen does not change applied range', applied() === appliedAtStart, applied());
    check('P13 reopen does not touch KPIs', kpi() === kpiAtStart);

    /* now actually apply a range */
    await spin(monC('from'), targetMon);
    const wantDraft = draft();
    check('P13b draft differs from applied', wantDraft !== appliedAtStart, wantDraft + ' vs ' + appliedAtStart);
    Shell.applyRange();
    await sleep(60);
    check('P14 Apply commits the draft', applied() === wantDraft, applied() + ' vs ' + wantDraft);
    check('P15 Apply closes the strip', !document.getElementById('range-strip').classList.contains('open'));
    check('P16 Apply re-renders the KPIs', kpi() !== kpiAtStart);
    check('P17 Apply clears preset highlight', !document.querySelector('.sh-preset.active'));

    /* and it survives a reopen */
    Shell.toggleRange();
    await sleep(250);
    check('P18 applied range survives reopen', applied() === wantDraft, applied());
    check('P19 drums reopen on the applied range', draft() === wantDraft, draft());

    /* ═══ day column clamped to the real month length ═══ */
    await spin(dayC('from'), 30);                     // day 31
    await spin(monC('from'), 1);                      // February
    await sleep(120);
    const invalid = dayC('from')._items.filter(el => el.classList.contains('invalid')).map(el => el.textContent);
    check('P20 Feb 2025 disables 29-31', invalid.join(',') === '29,30,31', invalid.join(','));
    check('P21 day pulled back to 28', dayC('from')._currentIdx === 27, dayC('from')._currentIdx);
    check('P22 no impossible date in draft', !/31 Feb|30 Feb|29 Feb/.test(draft()), draft());

    await spin(yrC('from'), 1);                       // 2024 — leap year
    await sleep(120);
    const invalid24 = dayC('from')._items.filter(el => el.classList.contains('invalid')).map(el => el.textContent);
    check('P23 Feb 2024 allows the 29th (leap)', invalid24.join(',') === '30,31', invalid24.join(','));

    await spin(monC('from'), 3);                      // April — 30 days
    await sleep(120);
    const invalidApr = dayC('from')._items.filter(el => el.classList.contains('invalid')).map(el => el.textContent);
    check('P24 April disables only the 31st', invalidApr.join(',') === '31', invalidApr.join(','));

    /* From-after-To is blocked rather than silently applied */
    await spin(yrC('from'), 4);                       // 2027, well past the To date
    await sleep(120);
    check('P25 inverted range disables Apply', document.getElementById('sh-range-apply-btn').disabled);
    check('P26 inverted range explains why', /after/.test(document.getElementById('sh-range-hint').textContent));

    Shell.cancelRange();
    Shell.applyPreset('full');
    await sleep(60);

    /* ═══ edge cases ═══ */
    AppState.committedData = { transactions: [fx(1,{category:'Salaries'})], metadata:{} };
    Dashboard.mount();
    Shell.nav('trading');
    check('E1 trading tab with no trading data', document.getElementById('trading-content').innerHTML.includes('Net Capital Drawn'));
    const zero = tradingSummary([]);
    check('E2 tradingSummary([]) all zero', zero.statementNet === 0 && zero.drawnNet === 0 && zero.loansNet === 0);
    check('E3 sumPos/sumNeg empty', sumPos([]) === 0 && sumNeg([]) === 0);
    check('E4 operatingOnly([]) empty', operatingOnly([]).length === 0);

   } catch(err) {
     results.push({label:'EXCEPTION', pass:false, extra: err && (err.stack||err.message)});
   }
   window.__results = results;
   window.__done = true;
  });
})();
</script>
